name: essential
description: On-device multimodal assistant built with Gemma.
publish_to: "none"
version: 1.0.7+7

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  audio_waveforms: ^1.0.4
  camera: ^0.10.5+9
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  essential_sdk_dart:
    path: packages/essential_sdk_dart
  file_picker: ^8.0.0
  flutter_map: ^6.1.0
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  just_audio: ^0.9.36
  latlong2: ^0.9.0
  path: ^1.9.1
  path_provider: 2.1.5
  record: ^6.2.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/ja.json
    - assets/i18n/en.json
