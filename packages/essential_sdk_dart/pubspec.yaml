name: essential_sdk_dart
description: Essential Dart SDK package skeleton.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.15

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
